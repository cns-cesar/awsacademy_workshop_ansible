---
haproxy_package: haproxy
haproxy_service: haproxy
haproxy_bind_address: "0.0.0.0"
haproxy_port: 8080
haproxy_balance: roundrobin
haproxy_timeout_connect: 5s
haproxy_timeout_client: 30s
haproxy_timeout_server: 30s
haproxy_firewall_configure: true
haproxy_backend_servers:
  - name: web01
    address: 172.26.209.133
    port: 80
  - name: web02
    address: 172.26.209.138
    port: 80
